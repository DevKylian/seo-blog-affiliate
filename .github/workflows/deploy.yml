name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Compress build
        run: tar -czf build.tar.gz public/build

      - name: Copy build tarball to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "build.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Execute deployment script on server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Fix permissions before deletion
            sudo /usr/bin/chown -R deploy:www-data /var/www/businesskit.fr
            
            # Delete old build and extract new one
            rm -rf /var/www/businesskit.fr/public/build
            tar -xzf /tmp/build.tar.gz -C /var/www/businesskit.fr --no-same-owner
            rm -f /tmp/build.tar.gz
            
            # Run the deployment script
            cd /var/www/businesskit.fr
            bash deploy/deploy.sh
